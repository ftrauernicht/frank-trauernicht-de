# Patch- und Minor-Updates reisen als ein einziger Pull Request statt als einer je
# Paket. Der Gruppenname landet im Branch, und .github/workflows/dependabot-auto-merge.yml
# merged einen Branch mit diesem Namen, sobald jede Pruefung darauf gruen ist. Ein Major
# gehoert zu keiner Gruppe, kommt allein an und bleibt offen — und genau das soll er, denn
# dort aendert sich das Verhalten, nicht nur die Versionsnummer.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      safe:
        update-types: ["minor", "patch"]

  # Die Actions sind auf Commit-SHA gepinnt. Dependabot hebt den SHA und den
  # Kommentar dahinter gemeinsam an — genau deshalb ist das Pinnen wartbar.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      safe:
        update-types: ["minor", "patch"]
