version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
  # Die Actions sind auf Commit-SHA gepinnt. Dependabot hebt den SHA und den
  # Kommentar dahinter gemeinsam an — genau deshalb ist das Pinnen wartbar.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
